<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sfera XR — Metaverso a Scuola</title>
    <link rel="stylesheet" href="/assets/xr-hud.css">
    <style>
      #backButton {
        position: fixed;
        left: 1rem;
        bottom: 1rem;
        z-index: 12;
        min-height: 36px;
        padding: 0.45rem 0.8rem;
        border: 1px solid var(--xr-line);
        background: var(--xr-panel);
        color: var(--xr-text);
        font: 600 0.8rem var(--xr-font);
        text-decoration: none;
        cursor: pointer;
      }
      #backButton:hover,
      #backButton:focus-visible {
        border-color: var(--xr-accent);
        outline: none;
      }
    </style>
  </head>
  <body>
    <a id="backButton" href="index.html">Torna a Matematica</a>

    <div id="panel">
      <div class="panel-inner">
        <div class="ph">
          <div>
            <div class="ph-title">Sfera XR</div>
            <div class="ph-sub">2025-26 IV C INF</div>
          </div>
        </div>

        <div class="sec-label">Parametri</div>
        <div class="sr">
          <span class="sn">R</span>
          <input type="range" id="radiusSlider" min="0.5" max="5" step="0.1" value="1" />
          <span id="radiusValue" class="sv">1.0</span>
        </div>
        <div class="sr">
          <span class="sn">X</span>
          <input type="range" id="centerSlider" min="-2" max="2" step="0.1" value="0" />
          <span id="centerValue" class="sv">0.0</span>
        </div>
        <div class="sr">
          <span class="sn">Y</span>
          <input type="range" id="centerYSlider" min="-2" max="2" step="0.1" value="0" />
          <span id="centerYValue" class="sv">0.0</span>
        </div>
        <div class="sr">
          <span class="sn">Z</span>
          <input type="range" id="centerZSlider" min="-2" max="2" step="0.1" value="0" />
          <span id="centerZValue" class="sv">0.0</span>
        </div>

        <div id="formulaBox" class="formula">r = 1.0 · centro (0.0, 0.0, 0.0)</div>

        <div class="div"></div>
        <div class="info-vr">
          In VR: punta gli assi e tieni premuto il grilletto per ruotare o spostare il gruppo.
          I parametri restano su questo pannello 2D o sullo stesso layout sul controller desktop.
        </div>
      </div>
    </div>

    <script type="module">
      import * as THREE from '/vendor/three/build/three.module.js'
      import { VRButton } from '/vendor/three/examples/jsm/webxr/VRButton.js'

      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.xr.enabled = true
      renderer.xr.setReferenceSpaceType('local')
      document.body.appendChild(renderer.domElement)
      document.body.appendChild(VRButton.createButton(renderer))

      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x0e1114)

      const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 100)
      camera.position.set(0, 1.6, 4)

      scene.add(new THREE.HemisphereLight(0xdde8e4, 0x1a1f24, 0.95))
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.75)
      directionalLight.position.set(4, 7, 3)
      scene.add(directionalLight)

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(20, 20),
        new THREE.MeshStandardMaterial({ color: 0x14181c, roughness: 0.95, metalness: 0.05 })
      )
      floor.rotation.x = -Math.PI / 2
      scene.add(floor)

      const grid = new THREE.GridHelper(20, 40, 0x2a343c, 0x1a2026)
      grid.position.y = 0.01
      scene.add(grid)

      const axesGroup = new THREE.Group()
      axesGroup.position.set(0, 1.25, -1.2)
      scene.add(axesGroup)

      let radius = 1
      let centerX = 0
      let centerY = 0
      let centerZ = 0
      let sphereMesh = null

      createAxes()
      sphereMesh = createSphere()

      const radiusSlider = document.getElementById('radiusSlider')
      const centerSlider = document.getElementById('centerSlider')
      const centerYSlider = document.getElementById('centerYSlider')
      const centerZSlider = document.getElementById('centerZSlider')
      const formulaBox = document.getElementById('formulaBox')
      const radiusValue = document.getElementById('radiusValue')
      const centerValue = document.getElementById('centerValue')
      const centerYValue = document.getElementById('centerYValue')
      const centerZValue = document.getElementById('centerZValue')
      const backButton = document.getElementById('backButton')

      const onParameterChange = () => {
        radius = parseFloat(radiusSlider.value)
        centerX = parseFloat(centerSlider.value)
        centerY = parseFloat(centerYSlider.value)
        centerZ = parseFloat(centerZSlider.value)
        radiusValue.textContent = radius.toFixed(1)
        centerValue.textContent = centerX.toFixed(1)
        centerYValue.textContent = centerY.toFixed(1)
        centerZValue.textContent = centerZ.toFixed(1)
        updateSphere()
        formulaBox.textContent = `r = ${radius.toFixed(1)} · centro (${centerX.toFixed(1)}, ${centerY.toFixed(1)}, ${centerZ.toFixed(1)})`
      }

      radiusSlider.addEventListener('input', onParameterChange)
      centerSlider.addEventListener('input', onParameterChange)
      centerYSlider.addEventListener('input', onParameterChange)
      centerZSlider.addEventListener('input', onParameterChange)

      const controllers = [createController(0), createController(1)]
      controllers.forEach((controller) => scene.add(controller))

      const raycaster = new THREE.Raycaster()
      const tempMatrix = new THREE.Matrix4()
      let selectedController = null
      const controllerStartQuat = new THREE.Quaternion()
      const axesStartQuat = new THREE.Quaternion()
      const controllerStartPos = new THREE.Vector3()
      const axesStartPos = new THREE.Vector3()

      window.addEventListener('resize', onWindowResize)
      renderer.setAnimationLoop(render)

      renderer.xr.addEventListener('sessionstart', () => {
        backButton.style.display = 'none'
        document.getElementById('panel').style.display = 'none'
      })
      renderer.xr.addEventListener('sessionend', () => {
        backButton.style.display = 'block'
        document.getElementById('panel').style.display = 'block'
      })

      const updateSphere = () => {
        if (!sphereMesh) return
        sphereMesh.scale.setScalar(radius)
        sphereMesh.position.set(centerX, radius + centerY, centerZ)
      }

      const createAxes = () => {
        const material = new THREE.MeshStandardMaterial({ color: 0x9fd0c0, roughness: 0.35, metalness: 0.15 })
        const length = 2.4
        const thickness = 0.025

        const xAxis = new THREE.Mesh(new THREE.CylinderGeometry(thickness, thickness, length, 12), material)
        xAxis.rotation.z = -Math.PI / 2
        xAxis.position.x = length / 2
        axesGroup.add(xAxis)

        const yAxis = new THREE.Mesh(new THREE.CylinderGeometry(thickness, thickness, length, 12), material)
        yAxis.position.y = length / 2
        axesGroup.add(yAxis)

        const zAxis = new THREE.Mesh(new THREE.CylinderGeometry(thickness, thickness, length, 12), material)
        zAxis.rotation.x = Math.PI / 2
        zAxis.position.z = length / 2
        axesGroup.add(zAxis)

        const arrow = new THREE.ConeGeometry(0.07, 0.2, 16)
        const xArrow = new THREE.Mesh(arrow, material)
        xArrow.rotation.z = -Math.PI / 2
        xArrow.position.set(length, 0, 0)
        axesGroup.add(xArrow)

        const yArrow = new THREE.Mesh(arrow, material)
        yArrow.position.set(0, length, 0)
        axesGroup.add(yArrow)

        const zArrow = new THREE.Mesh(arrow, material)
        zArrow.rotation.x = Math.PI / 2
        zArrow.position.set(0, 0, length)
        axesGroup.add(zArrow)

        axesGroup.add(createLabel('X', length + 0.18, 0, 0))
        axesGroup.add(createLabel('Y', 0, length + 0.18, 0))
        axesGroup.add(createLabel('Z', 0, 0, length + 0.18))
      }

      const createLabel = (text, x, y, z) => {
        const canvas = document.createElement('canvas')
        canvas.width = 128
        canvas.height = 128
        const ctx = canvas.getContext('2d')
        ctx.clearRect(0, 0, canvas.width, canvas.height)
        ctx.font = '700 64px IBM Plex Sans, sans-serif'
        ctx.textAlign = 'center'
        ctx.textBaseline = 'middle'
        ctx.fillStyle = '#e8ebe8'
        ctx.fillText(text, canvas.width / 2, canvas.height / 2)

        const texture = new THREE.CanvasTexture(canvas)
        const label = new THREE.Mesh(
          new THREE.PlaneGeometry(0.28, 0.28),
          new THREE.MeshBasicMaterial({ map: texture, transparent: true })
        )
        label.position.set(x, y, z)
        return label
      }

      const createSphere = () => {
        const material = new THREE.MeshStandardMaterial({
          color: 0xd4a574,
          roughness: 0.45,
          metalness: 0.12
        })
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), material)
        sphere.position.set(0, 1, 0)
        axesGroup.add(sphere)
        return sphere
      }

      const createController = (index) => {
        const controller = renderer.xr.getController(index)
        controller.addEventListener('selectstart', onSelectStart)
        controller.addEventListener('selectend', onSelectEnd)

        const ray = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]),
          new THREE.LineBasicMaterial({ color: 0x9fd0c0 })
        )
        ray.name = 'ray'
        ray.scale.z = 6
        controller.add(ray)
        return controller
      }

      const onSelectStart = (event) => {
        const controller = event.target
        const intersections = getControllerIntersections(controller)
        if (!intersections.length) return
        selectedController = controller
        controllerStartQuat.copy(controller.quaternion)
        axesStartQuat.copy(axesGroup.quaternion)
        controllerStartPos.setFromMatrixPosition(controller.matrixWorld)
        axesStartPos.copy(axesGroup.position)
      }

      const onSelectEnd = () => {
        selectedController = null
      }

      const getControllerIntersections = (controller) => {
        tempMatrix.identity().extractRotation(controller.matrixWorld)
        raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld)
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix)
        return raycaster.intersectObjects(axesGroup.children, true)
      }

      const onWindowResize = () => {
        camera.aspect = window.innerWidth / window.innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(window.innerWidth, window.innerHeight)
      }

      const render = () => {
        if (selectedController) {
          const currentQuat = selectedController.quaternion.clone()
          const deltaQuat = currentQuat.multiply(controllerStartQuat.clone().invert())
          axesGroup.quaternion.copy(axesStartQuat).premultiply(deltaQuat)

          const currentPos = new THREE.Vector3().setFromMatrixPosition(selectedController.matrixWorld)
          const deltaPos = currentPos.clone().sub(controllerStartPos)
          axesGroup.position.copy(axesStartPos).add(deltaPos)
        }

        renderer.render(scene, camera)
      }
    </script>
  </body>
</html>
