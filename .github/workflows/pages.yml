name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: npm install

      - name: Build vendored Three.js assets
        run: npm run vendor

      - name: IWSDK locomotion install
        run: npm install
        working-directory: iwsdk-demo/locomotion

      - name: IWSDK locomotion build
        run: npm run build
        working-directory: iwsdk-demo/locomotion

      - name: IWSDK locomotion copy
        run: cp -R iwsdk-demo/locomotion/dist/. docs/demo/iwsdk-locomotion

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
